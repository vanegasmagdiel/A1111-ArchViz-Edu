name: validate-a0-source
on:
  push:
    paths:
      - 'src/runtime-core/archviz/installer.py'
      - 'src/bootstrap/archviz82/bootstrap_a0.ps1'
      - 'src/bootstrap/archviz82/planner.py'
      - 'src/bootstrap/archviz82/test_planner.py'
      - 'src/runtime-core/archviz/test_profile_defaults.py'
      - 'tools/**'
      - '.github/workflows/validate-a0.yml'
  pull_request:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repository policy checks
        run: python tools/validate_repo.py
      - name: Planner tests
        working-directory: src/bootstrap/archviz82
        run: python -m unittest -v test_planner.py
      - name: Profile tests
        working-directory: src/runtime-core/archviz
        run: python -m unittest -v test_profile_defaults.py
