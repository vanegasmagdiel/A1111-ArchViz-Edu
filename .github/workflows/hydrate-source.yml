name: hydrate-frozen-source
on:
  push:
    branches: [main]
    paths:
      - '.source_payload/**'
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Rehydrate exact frozen sources
        shell: python
        run: |
          import gzip, hashlib
          from pathlib import Path
          pairs = [
              (Path('.source_payload/bootstrap_a0.ps1.gz'), Path('src/bootstrap/archviz82/bootstrap_a0.ps1'), '40b033586df0cb9c6a20aa0bcdaaa24247a7389ee00e5b7d52f6490274d19e5f'),
              (Path('.source_payload/installer.py.gz'), Path('src/runtime-core/archviz/installer.py'), 'd88ad6fad60da8d78bfcd1011695e9869708660514f2e98ce48713efcb596bf2'),
          ]
          for src, dst, expected in pairs:
              data = gzip.decompress(src.read_bytes())
              got = hashlib.sha256(data).hexdigest()
              if got != expected:
                  raise SystemExit(f'hash mismatch for {dst}: {got} != {expected}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              print(f'PASS {dst} {got}')
      - name: Commit hydrated sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .source_payload
          git add -A
          git commit -m "Hydrate exact frozen A0 source" || exit 0
          git push
