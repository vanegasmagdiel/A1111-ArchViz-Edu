name: publish-a0-source-release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-a0-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repository policy checks
        run: python tools/validate_repo.py
      - name: Canonical frozen-source SHA-256 gates
        shell: pwsh
        run: |
          $bootstrap = (Get-FileHash 'src/bootstrap/archviz82/bootstrap_a0.ps1' -Algorithm SHA256).Hash.ToLower()
          $installer = (Get-FileHash 'src/runtime-core/archviz/installer.py' -Algorithm SHA256).Hash.ToLower()
          if ($bootstrap -ne '40b033586df0cb9c6a20aa0bcdaaa24247a7389ee00e5b7d52f6490274d19e5f') { throw "bootstrap_a0.ps1 SHA mismatch: $bootstrap" }
          if ($installer -ne 'd88ad6fad60da8d78bfcd1011695e9869708660514f2e98ce48713efcb596bf2') { throw "installer.py SHA mismatch: $installer" }
          Write-Host '[PASS] Canonical A0 source hashes'
      - name: Syntax and unit gates
        shell: pwsh
        run: |
          python -m py_compile src/runtime-core/archviz/installer.py src/bootstrap/archviz82/planner.py
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/bootstrap/archviz82/bootstrap_a0.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Push-Location src/bootstrap/archviz82
          python -m unittest -v test_planner.py
          Pop-Location
          Push-Location src/runtime-core/archviz
          python -m unittest -v test_profile_defaults.py
          Pop-Location
      - name: Create immutable A0 source release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v8.2.0-A0-STABLE *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v8.2.0-A0-STABLE already exists; leaving it unchanged.'
            exit 0
          }
          gh release create v8.2.0-A0-STABLE `
            --target $env:GITHUB_SHA `
            --title 'A1111 ArchViz v8.2 A0 STABLE — Educational Source Baseline' `
            --notes-file 'release/RELEASE_NOTES_v8.2.0-A0-STABLE.md' `
            --latest
